name: deploy

# Manual. Needs repository variables GCP_PROJECT, GCP_REGION, WIF_PROVIDER, DEPLOYER_SA,
# IMAGE_REPOSITORY (all from `terraform output`).
on:
  workflow_dispatch:

permissions:
  id-token: write   # keyless: GitHub OIDC -> Workload Identity Federation
  contents: read

concurrency: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production   # add required reviewers in repo settings for a manual approval gate
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push (tag = commit SHA; tags are immutable)
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -t "${{ vars.IMAGE_REPOSITORY }}:${{ github.sha }}" .
          docker push "${{ vars.IMAGE_REPOSITORY }}:${{ github.sha }}"
      - name: Roll out worker, then API
        run: |
          for svc in agents-worker agents-api; do
            gcloud run services update "$svc" --region "${{ vars.GCP_REGION }}" \
              --image "${{ vars.IMAGE_REPOSITORY }}:${{ github.sha }}" --quiet
          done
